name: TaskFlow CI

# When
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# What to do
jobs:
  build-and-test:
    # Operating System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm install

      - name: Build Frontend
        working-directory: ./apps/web
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./apps/api
        run: npm install

      - name: Run Backend Tests
        working-directory: ./apps/api
        run: npm test
